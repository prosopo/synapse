name: Synapse Build
on:
  pull_request:
    branches:
      - main

jobs:
  Build-install-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: sudo ./builder.sh
        working-directory: ./pkg/deb

      - name: Installing package
        run: sudo dpkg --install ./synapse*.deb
        working-directory: ./pkg/deb

      - name: Start Synapse service
        run: sudo systemctl start synapse

      - name: Check Synapse running
        run: sudo systemctl status synapse

      - name: Remove package installation
        if: always()
        run: sudo dpkg --purge synapse


  Build-install-redhat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Build systemd-enabled Red Hat image
        shell: bash
        run: |
          set -euxo pipefail
          
          # Create a Dockerfile for systemd-enabled Red Hat UBI
          cat > /tmp/Dockerfile.redhat-systemd << 'EOF'
          FROM redhat/ubi10:10.1-1766033862
          RUN yum install -y systemd systemd-libs && yum clean all
          CMD ["/usr/lib/systemd/systemd"]
          EOF
          
          docker build -t redhat-systemd -f /tmp/Dockerfile.redhat-systemd /tmp

      - name: Start Red Hat systemd container (PID 1) + install deps
        shell: bash
        run: |
          set -euxo pipefail

          # Start systemd as PID 1 
          docker run -d --name synapse-rpm-test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec \
            -v "${GITHUB_WORKSPACE}:/workspace:rw" \
            -w /workspace \
            redhat-systemd

          # Wait for systemd to come up
          sleep 5
          for i in {1..30}; do
            if docker exec synapse-rpm-test systemctl is-system-running --wait >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec synapse-rpm-test systemctl is-system-running || true

          # Install build/runtime deps inside the RPM OS
          docker exec synapse-rpm-test bash -lc '
            yum install -y git rpm-build tar gcc openssl-devel cmake clang llvm elfutils-libelf-devel libzstd-devel perl perl-IPC-Cmd curl
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          '

      - name: Build RPM inside Red Hat
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test bash -lc '
            export PATH="$HOME/.cargo/bin:$PATH"
            cd /workspace/pkg/rpm
            ./builder.sh
          '

      - name: Install RPM inside Red Hat
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test bash -lc '
            cd /workspace/pkg/rpm
            yum install -y ./synapse*.rpm
          '

      - name: Start Synapse service
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test systemctl daemon-reload
          docker exec synapse-rpm-test systemctl start synapse || {
            echo "=== Service failed to start, checking logs ==="
            docker exec synapse-rpm-test systemctl status synapse --no-pager || true
            docker exec synapse-rpm-test journalctl -xeu synapse --no-pager || true
            exit 1
          }

      - name: Check Synapse running
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test systemctl status synapse --no-pager
          docker exec synapse-rpm-test journalctl -xeu synapse --no-pager -n 20 || true

      - name: Remove package installation
        if: always()
        shell: bash
        run: |
          set +e
          docker exec synapse-rpm-test yum remove -y synapse
          docker rm -f synapse-rpm-test
