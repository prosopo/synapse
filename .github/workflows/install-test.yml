name: Install test
on:
  pull_request:
    branches:
      - main

jobs:
  Build-install-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: sudo ./builder.sh
        working-directory: ./pkg/deb

      - name: Installing package
        run: sudo dpkg --install ./synapse*.deb
        working-directory: ./pkg/deb

      - name: Start Synapse service
        run: sudo systemctl start synapse

      - name: Check Synapse running
        run: sudo systemctl status synapse

      - name: Remove package installation
        if: always()
        run: sudo dpkg --purge synapse


  Build-install-rocky:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          yum install -y systemd git rpm-build tar gcc openssl-devel cmake clang llvm elfutils-libelf-devel libzstd-devel perl perl-IPC-Cmd --allowerasing
          systemctl --version || true

      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: ./builder.sh
        working-directory: ./pkg/rpm

      - name: Installing package
        run: yum install -y ./synapse*.rpm
        working-directory: ./pkg/rpm

      - name: Start Synapse service
        run: systemctl start synapse

      - name: Check Synapse running
        run: systemctl status synapse

      - name: Remove package installation
        if: always()
        run: yum remove -y synapse
