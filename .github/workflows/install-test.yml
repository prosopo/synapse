name: Install test
on:
  pull_request:
    branches:
      - main

jobs:
  Build-install-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: sudo ./builder.sh
        working-directory: ./pkg/deb

      - name: Installing package
        run: sudo dpkg --install ./synapse*.deb
        working-directory: ./pkg/deb

      - name: Start Synapse service
        run: sudo systemctl start synapse

      - name: Check Synapse running
        run: sudo systemctl status synapse

      - name: Remove package installation
        if: always()
        run: sudo dpkg --purge synapse


  Build-install-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run:exec
    steps:
      - name: Install dependencies
        run: |
          dnf install -y systemd git rpm-build tar gcc openssl-devel cmake clang llvm elfutils-libelf-devel libzstd-devel perl perl-IPC-Cmd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./builder.sh
        working-directory: ./pkg/rpm

      - name: Installing package
        run: dnf install -y ./synapse*.rpm
        working-directory: ./pkg/rpm

      - name: Start Synapse service
        run: systemctl start synapse

      - name: Check Synapse running
        run: systemctl status synapse

      - name: Remove package installation
        if: always()
        run: dnf remove -y synapse || true
