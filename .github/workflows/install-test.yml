name: Synapse Build
on:
  pull_request:
    branches:
      - main

jobs:
  build-install-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Building package
        run: sudo ./builder.sh
        working-directory: ./pkg/deb

      - name: Installing package
        run: sudo dpkg --install ./synapse*.deb
        working-directory: ./pkg/deb

      - name: Start Synapse service
        run: sudo systemctl start synapse

      - name: Check Synapse running
        run: sudo systemctl status synapse

      - name: Remove package installation
        if: always()
        run: sudo dpkg --purge synapse


  build-install-fedora:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code, branch='${{ github.ref }}'
        uses: actions/checkout@v4

      - name: Build RPM using release Dockerfile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/rpm-build-output
          docker build -t synapse-builder-rpm:latest -f pkg/rpm/docker/Dockerfile pkg/rpm/docker/
          docker run -v "${GITHUB_WORKSPACE}:/tmp/repo" -v /tmp/rpm-build-output:/tmp/output --rm synapse-builder-rpm:latest

      - name: Build systemd-enabled Fedora image for testing
        shell: bash
        run: |
          set -euxo pipefail

          # Create a Dockerfile for systemd-enabled Fedora (minimal, just for testing)
          cat > /tmp/Dockerfile.fedora-systemd << 'EOF'
          FROM fedora:latest
          RUN dnf install -y systemd systemd-libs && dnf clean all
          CMD ["/usr/lib/systemd/systemd"]
          EOF

          docker build -t fedora-systemd -f /tmp/Dockerfile.fedora-systemd /tmp

      - name: Start Fedora systemd container for testing
        shell: bash
        run: |
          set -euxo pipefail

          # Start systemd as PID 1
          docker run -d --name synapse-rpm-test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec \
            -v /tmp/rpm-build-output:/workspace/rpm:ro \
            fedora-systemd

          # Wait for systemd to come up
          sleep 5
          for i in {1..30}; do
            if docker exec synapse-rpm-test systemctl is-system-running --wait >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec synapse-rpm-test systemctl is-system-running || true

      - name: Install RPM inside Fedora
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test bash -lc '
            cd /workspace/rpm
            dnf install -y ./synapse*.rpm
          '

      - name: Start Synapse service
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test systemctl daemon-reload
          docker exec synapse-rpm-test systemctl start synapse || {
            echo "=== Service failed to start, checking logs ==="
            docker exec synapse-rpm-test systemctl status synapse --no-pager || true
            docker exec synapse-rpm-test journalctl -xeu synapse --no-pager || true
            exit 1
          }

      - name: Check Synapse running
        shell: bash
        run: |
          set -euxo pipefail
          docker exec synapse-rpm-test systemctl status synapse --no-pager
          docker exec synapse-rpm-test journalctl -xeu synapse --no-pager -n 20 || true

      - name: Remove package installation
        if: always()
        shell: bash
        run: |
          set +e
          docker exec synapse-rpm-test dnf remove -y synapse
          docker rm -f synapse-rpm-test
