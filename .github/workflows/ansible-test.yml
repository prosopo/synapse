            else
              echo "✗ Pingora section should not be present in agent mode"
              exit 1
            fi
            if ! grep -q "^acme:" /etc/synapse/config.yaml; then
              echo "✓ ACME section excluded (agent mode)"
            else
              echo "✗ ACME section should not be present in agent mode"
              exit 1
            fi
          '

      - name: Run Ansible playbook - Proxy Mode (Oracle)
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -w /tmp/ansible ansible-oracle-test bash -c '
            ansible-playbook playbook.yml \
              -e synapse_version="0.3.2" \
              -e synapse_branch="main" \
              -e clamav_enabled=true \
              -e redis_enabled=true \
              -e fail2ban_enabled=true \
              -e synapse_config_mode="proxy"
          '

      - name: Verify Proxy Mode Configuration (Oracle)
        shell: bash
        run: |
          set -euxo pipefail
          docker exec ansible-oracle-test bash -c '
            if [ ! -f /etc/synapse/config.yaml ]; then
              echo "✗ Config file not found"
              exit 1
            fi
            # Verify mode is set to proxy (handle both quoted and unquoted)
            if grep -qE "^mode: (\"proxy\"|proxy)" /etc/synapse/config.yaml; then
              echo "✓ Mode is set to proxy"
            else
              echo "✗ Mode is not set to proxy"
              cat /etc/synapse/config.yaml | grep -A 2 "^mode:"
              exit 1
            fi
            # Verify proxy mode includes all features
            if grep -q "^redis:" /etc/synapse/config.yaml; then
              echo "✓ Redis section included (proxy mode)"
            else
              echo "✗ Redis section should be present in proxy mode"
              exit 1
            fi
            if grep -q "^geoip:" /etc/synapse/config.yaml; then
              echo "✓ GeoIP section included (proxy mode)"
            else
              echo "✗ GeoIP section should be present in proxy mode"
              exit 1
            fi
            if grep -q "^content_scanning:" /etc/synapse/config.yaml; then
              echo "✓ Content scanning section included (proxy mode)"
            else
              echo "✗ Content scanning section should be present in proxy mode"
              exit 1
            fi
            if grep -q "^pingora:" /etc/synapse/config.yaml; then
              echo "✓ Pingora section included (proxy mode)"
            else
              echo "✗ Pingora section should be present in proxy mode"
              exit 1
            fi
            if grep -q "^acme:" /etc/synapse/config.yaml; then
              echo "✓ ACME section included (proxy mode)"
            else
