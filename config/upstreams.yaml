provider: "file" # "file" "consul" "kubernetes"
config:
  https_proxy_enabled: false
  sticky_sessions: false
  global_rate_limit: 100
  global_headers:
    - "Access-Control-Allow-Origin:*"
    - "Access-Control-Allow-Methods:POST, GET, OPTIONS"
    - "Access-Control-Max-Age:86400"
    - "Strict-Transport-Security:max-age=31536000; includeSubDomains; preload"

arxignis_paths:
  "/cgi-bin/captcha/verify":
    rate_limit: 200
    https_proxy_enabled: false
    ssl_enabled: false
    servers:
      - "127.0.0.1:3001"

  "/.well-known/acme-challenge/*":
    rate_limit: 200
    https_proxy_enabled: false
    ssl_enabled: false
    servers:
      - "127.0.0.1:9180"
  "/health":
    rate_limit: 100
    https_proxy_enabled: false
    ssl_enabled: false
    disable_access_log: true  # Disable access logs for health checks to reduce noise
    servers:
      - "127.0.0.1:8000"

upstreams:
  example.com:
    certificate: "example.com"
    acme:
      challenge_type: "dns-01"
      email: "<EMAIL>"
      wildcard: true
    paths:
      "/":
        rate_limit: 200
        force_https: true
        ssl_enabled: true
        headers:
          - "Host: whoami.arxignis.com"
        servers:
          - "whoami.arxignis.com:443"
