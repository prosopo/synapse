---
- name: Detect architecture
  ansible.builtin.set_fact:
    synapse_arch: "{{ ansible_facts['architecture'] }}"
  when: synapse_arch is not defined

- name: Map architecture names for DEB packages
  ansible.builtin.set_fact:
    synapse_arch_deb: >-
      {%- if synapse_arch == 'x86_64' -%}
      amd64
      {%- elif synapse_arch == 'aarch64' or synapse_arch == 'arm64' -%}
      arm64
      {%- else -%}
      {{ synapse_arch }}
      {%- endif -%}

- name: Map architecture names for RPM and binary packages
  ansible.builtin.set_fact:
    synapse_arch_rpm: >-
      {%- if synapse_arch == 'x86_64' -%}
      x86_64
      {%- elif synapse_arch == 'aarch64' or synapse_arch == 'arm64' -%}
      aarch64
      {%- else -%}
      {{ synapse_arch }}
      {%- endif -%}

- name: Install curl
  ansible.builtin.package:
    name: curl
    state: present

- name: Install sed
  ansible.builtin.package:
    name: sed
    state: present

- name: Install ClamAV (Debian/Ubuntu)
  ansible.builtin.package:
    name: clamav-daemon
    state: present
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'Debian'

- name: Install EPEL repository (RHEL/CentOS/Oracle Linux)
  ansible.builtin.package:
    name: epel-release
    state: present
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'RedHat'
    - ansible_facts["distribution"] != 'Fedora'
  ignore_errors: true

- name: Install ClamAV (RHEL/CentOS/Fedora)
  ansible.builtin.package:
    name: clamav
    state: present
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'RedHat'

- name: Install Redis (Debian/Ubuntu)
  ansible.builtin.package:
    name: redis-server
    state: present
  when:
    - redis_enabled | bool
    - ansible_facts["os_family"] == 'Debian'

- name: Install Redis (RHEL/CentOS/Fedora)
  ansible.builtin.package:
    name: redis
    state: present
  when:
    - redis_enabled | bool
    - ansible_facts["os_family"] == 'RedHat'

- name: Set ClamAV config directory
  ansible.builtin.set_fact:
    clamav_config_dir: "/etc/clamav"
    clamav_config_file: "/etc/clamav/clamd.conf"
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'Debian'

- name: Set ClamAV config directory and service (Fedora)
  ansible.builtin.set_fact:
    clamav_config_dir: "/etc/clamd.d"
    clamav_config_file: "/etc/clamd.d/scan.conf"
    clamav_service_name: "clamd@scan"
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'RedHat'
    - ansible_facts["distribution"] == 'Fedora'

- name: Set ClamAV config directory and service (RHEL/CentOS/Oracle Linux)
  ansible.builtin.set_fact:
    clamav_config_dir: "/etc/clamd.d"
    clamav_config_file: "/etc/clamd.d/scan.conf"
    clamav_service_name: "clamd"
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'RedHat'
    - ansible_facts["distribution"] != 'Fedora'

- name: Set ClamAV service name (Debian/Ubuntu)
  ansible.builtin.set_fact:
    clamav_service_name: "clamav-daemon"
  when:
    - clamav_enabled | bool
    - ansible_facts["os_family"] == 'Debian'

- name: Create ClamAV directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ clamav_config_dir | default('/etc/clamav') }}"
    - /etc/systemd/system/clamav-daemon.socket.d
  when: clamav_enabled | bool

- name: Download ClamAV configuration
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/synapse/refs/heads/{{ synapse_branch }}/others/clamd/clamd.conf"
    dest: "{{ clamav_config_file | default('/etc/clamav/clamd.conf') }}"
    mode: '0644'
  when: clamav_enabled | bool

- name: Download ClamAV systemd override
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/synapse/refs/heads/{{ synapse_branch }}/others/systemd/clamd/override.conf"
    dest: /etc/systemd/system/clamav-daemon.socket.d/override.conf
    mode: '0644'
  when: clamav_enabled | bool

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  when: clamav_enabled | bool

- name: Check if ClamAV service exists
  ansible.builtin.shell:
    cmd: systemctl list-unit-files --type=service --no-pager | grep -E "(clamav-daemon|clamd@scan|clamd\.service|clamd@)" | head -1 | awk '{print $1}' || echo ""
  register: clamav_service_found
  changed_when: false
  failed_when: false
  when: clamav_enabled | bool

- name: Enable and start ClamAV daemon (if service exists)
  ansible.builtin.systemd:
    name: "{{ clamav_service_found.stdout | default(clamav_service_name | default('clamav-daemon')) }}"
    enabled: yes
    state: started
  when:
    - clamav_enabled | bool
    - clamav_service_found.stdout != ""
  ignore_errors: true
  register: clamav_service_result

- name: Display ClamAV service status
  ansible.builtin.debug:
    msg: >-
      {%- if clamav_service_found.stdout != "" -%}
        ClamAV service {{ 'started successfully' if clamav_service_result is succeeded else 'could not be started' }}
      {%- else -%}
        ClamAV is installed but no systemd service found. ClamAV may need to be started manually or configured separately.
      {%- endif -%}
  when:
    - clamav_enabled | bool
    - clamav_service_found is defined

- name: Check if .deb package exists
  ansible.builtin.uri:
    url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse_{{ synapse_version }}-1_{{ synapse_arch_deb }}.deb"
    method: HEAD
    status_code: 200
  register: deb_package_check
  failed_when: false
  when: ansible_facts["pkg_mgr"] == 'apt'

- name: Download and install .deb package
  block:
    - name: Download .deb package
      ansible.builtin.get_url:
        url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse_{{ synapse_version }}-1_{{ synapse_arch_deb }}.deb"
        dest: "/tmp/synapse_{{ synapse_version }}-1_{{ synapse_arch_deb }}.deb"
        mode: '0644'

    - name: Install .deb package
      ansible.builtin.apt:
        deb: "/tmp/synapse_{{ synapse_version }}-1_{{ synapse_arch_deb }}.deb"
        state: present
        update_cache: no

    - name: Set installation method fact
      ansible.builtin.set_fact:
        synapse_installed: true
        synapse_install_method: "deb"
  when:
    - ansible_facts["pkg_mgr"] == 'apt'
    - deb_package_check.status == 200

- name: Check if .rpm package exists
  ansible.builtin.uri:
    url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse-{{ synapse_version }}-1.{{ synapse_arch_rpm }}.rpm"
    method: HEAD
    status_code: 200
  register: rpm_package_check
  failed_when: false
  when: ansible_facts["pkg_mgr"] in ['yum', 'dnf']

- name: Download and install .rpm package
  block:
    - name: Download .rpm package
      ansible.builtin.get_url:
        url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse-{{ synapse_version }}-1.{{ synapse_arch_rpm }}.rpm"
        dest: "/tmp/synapse-{{ synapse_version }}-1.{{ synapse_arch_rpm }}.rpm"
        mode: '0644'

    - name: Install .rpm package (dnf)
      ansible.builtin.dnf:
        name: "/tmp/synapse-{{ synapse_version }}-1.{{ synapse_arch_rpm }}.rpm"
        state: present
        disable_gpg_check: true
      when: ansible_facts["pkg_mgr"] == 'dnf'

    - name: Install .rpm package (yum)
      ansible.builtin.yum:
        name: "/tmp/synapse-{{ synapse_version }}-1.{{ synapse_arch_rpm }}.rpm"
        state: present
        disable_gpg_check: true
      when: ansible_facts["pkg_mgr"] == 'yum'

    - name: Set installation method fact
      ansible.builtin.set_fact:
        synapse_installed: true
        synapse_install_method: "rpm"
  when:
    - ansible_facts["pkg_mgr"] in ['yum', 'dnf']
    - rpm_package_check.status == 200

- name: Check if binary tarball exists
  ansible.builtin.uri:
    url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse-{{ synapse_arch_rpm }}-unknown-linux-gnu.tar.gz"
    method: HEAD
    status_code: 200
  register: binary_package_check
  failed_when: false
  when: synapse_installed is not defined or synapse_installed != true

- name: Download and install binary (fallback)
  block:
    - name: Download binary tarball
      ansible.builtin.get_url:
        url: "https://github.com/gen0sec/synapse/releases/download/v{{ synapse_version }}/synapse-{{ synapse_arch_rpm }}-unknown-linux-gnu.tar.gz"
        dest: "/tmp/synapse-{{ synapse_arch_rpm }}-unknown-linux-gnu.tar.gz"
        mode: '0644'

    - name: Extract binary
      ansible.builtin.unarchive:
        src: "/tmp/synapse-{{ synapse_arch_rpm }}-unknown-linux-gnu.tar.gz"
        dest: /usr/local/bin
        remote_src: yes
        mode: '0755'

    - name: Set installation method fact
      ansible.builtin.set_fact:
        synapse_installed: true
        synapse_install_method: "binary"
  when:
    - synapse_installed is not defined or synapse_installed != true
    - binary_package_check.status == 200

- name: Download systemd service file
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/synapse/refs/heads/{{ synapse_branch }}/others/systemd/synapse.service"
    dest: /etc/systemd/system/synapse.service
    mode: '0644'

- name: Reload systemd daemon after service installation
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Create synapse directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/log/synapse
    - /var/run/synapse
    - /var/lib/synapse
    - /etc/synapse

- name: Download config.yaml (binary installation only)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/synapse/refs/heads/{{ synapse_branch }}/config_example.yaml"
    dest: /etc/synapse/config.yaml
    mode: '0640'
  when: synapse_install_method | default('binary') == 'binary'

- name: Download upstreams.yaml (binary installation only)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/synapse/refs/heads/{{ synapse_branch }}/upstreams_example.yaml"
    dest: /etc/synapse/upstreams.yaml
    mode: '0644'
  when: synapse_install_method | default('binary') == 'binary'

- name: Set API key in config (if provided)
  ansible.builtin.lineinfile:
    path: /etc/synapse/config.yaml
    regexp: '^api_key:'
    line: "api_key: {{ synapse_api_key }}"
    state: present
  when: synapse_api_key != ""

- name: Enable synapse service
  ansible.builtin.systemd:
    name: synapse
    enabled: yes
    daemon_reload: yes
