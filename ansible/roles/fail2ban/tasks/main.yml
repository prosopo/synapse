---
- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  when: ansible_facts["os_family"] in ['Debian', 'RedHat']

- name: Install jq (optional)
  ansible.builtin.package:
    name: jq
    state: present

- name: Download Gen0Sec action file
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/gen0sec/example/refs/heads/main/fail2ban/gen0sec.conf"
    dest: /etc/fail2ban/action.d/gen0sec.conf
    mode: '0640'
    owner: root
    group: root

- name: Configure Gen0Sec API token
  ansible.builtin.replace:
    path: /etc/fail2ban/action.d/gen0sec.conf
    regexp: '^g0stoken\s*=.*$'
    replace: 'g0stoken = {{ gen0sec_api_token }}'
  when: gen0sec_api_token != ""

- name: Configure Gen0Sec expiration
  ansible.builtin.replace:
    path: /etc/fail2ban/action.d/gen0sec.conf
    regexp: '^expiration\s*=\s*<bantime>.*$'
    replace: 'expiration = {{ gen0sec_expiration }}'

- name: Ensure token is set in configuration file (fallback)
  ansible.builtin.lineinfile:
    path: /etc/fail2ban/action.d/gen0sec.conf
    regexp: '^g0stoken\s*='
    line: 'g0stoken = {{ gen0sec_api_token }}'
    state: present
  when: gen0sec_api_token != ""

- name: Configure DEFAULT section in jail.local
  ansible.builtin.blockinfile:
    path: /etc/fail2ban/jail.local
    block: |
      [DEFAULT]
      banaction = gen0sec
      banaction_allports = gen0sec
      backend = {{ fail2ban_backend }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DEFAULT"
    create: yes
    owner: root
    group: root
    mode: '0644'

- name: Configure sshd jail
  ansible.builtin.blockinfile:
    path: /etc/fail2ban/jail.local
    block: |
      [sshd]
      enabled = {{ 'true' if fail2ban_jail_enabled else 'false' }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - SSHD"
    create: yes
    owner: root
    group: root
    mode: '0644'

- name: Ensure fail2ban service is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started
    daemon_reload: yes

- name: Restart fail2ban to apply configuration
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
